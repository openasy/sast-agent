rules:
  - id: openasy.javascript.tls-verification-off
    message: TLS certificates are not checked, so anyone in the path can read and change the traffic.
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { cwe: "CWE-295", category: security }
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
